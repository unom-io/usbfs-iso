# cargo-deny: licence and advisory policy.
#
# The dependency tree is deliberately tiny — `libc` and nothing else — so this file is mostly a
# tripwire. If it ever has to grow, that is a signal worth noticing rather than a chore.

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Everything here must be usable by a downstream that is itself MIT/Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
