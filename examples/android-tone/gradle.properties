org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Gradle/AGP 9 must RUN on JDK 17-21, not a newer default JDK. Android Studio uses its bundled
# JBR 21 automatically; from the CLI, launch gradlew with JDK 21:
#   JAVA_HOME="$(/usr/libexec/java_home -v 21)" ./gradlew assembleDebug
# Deliberately not setting org.gradle.java.home — it would hardcode a machine-specific path.
