[package]
name = "uac-host"
description = "A userspace USB Audio Class host driver: parse UAC1/UAC2 descriptors and play PCM to a USB audio device over isochronous usbfs, unprivileged, on Linux and Android."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["usb", "audio", "uac", "isochronous", "android"]
categories = ["hardware-support", "multimedia::audio", "os::linux-apis"]
readme = "README.md"

[features]
default = []
# UAC2 descriptor parsing and clock-entity rate discovery. UAC1 is all a DualSense needs; UAC2 is
# what most modern DACs speak. Behind a flag so the UAC1-only consumer pays nothing for it.
uac2 = []

[dependencies]
usbfs-iso.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
