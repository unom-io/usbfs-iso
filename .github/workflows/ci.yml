name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors here as well as in scripts/check.sh; a lint that only fails in one place
  # trains people to ignore it in the other.
  RUSTFLAGS: -D warnings

jobs:
  # Tier 0: everything that needs no kernel. Runs on macOS too, because the point of splitting the
  # pure-logic modules out is that a contributor on any host can work on them.
  tier0:
    name: tier-0 tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo test --workspace --features uac-host/uac2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features uac-host/uac2 -- -D warnings

  # The transfer machinery is gated to Linux and Android, so a host-only job compiles almost none
  # of it. `cargo clippy` needs no NDK — it never links — so every target is checkable here.
  targets:
    name: clippy ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} --features uac-host/uac2 -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match `rust-version` in Cargo.toml. Bumping it is a breaking change for downstreams,
      # so it is verified rather than aspirational.
      - uses: dtolnay/rust-toolchain@1.77.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --features uac-host/uac2

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Explicitly a Linux target: the transport modules are cfg'd out everywhere else, so a
      # host-only doc build would check barely half the crate.
      - run: cargo doc --workspace --no-deps --features uac-host/uac2 --target x86_64-unknown-linux-gnu
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Tier 1: a real virtual USB Audio device via dummy_hcd + f_uac1.
  #
  # MEASURED 2026-08-02 on ubuntu-latest (kernel 6.17.0-1020-azure): `# CONFIG_USB_GADGET is not
  # set`. Not just dummy_hcd missing — the whole gadget stack is absent from the cloud image, so no
  # amount of privilege makes the rig work on a hosted runner. Getting tier 1 green needs a
  # purpose-built VM or a self-hosted machine.
  #
  # So the job's job is to *report* that, and it succeeds when it has. A run that finds support and
  # then fails the rig is a genuine failure and turns the job red — which is the distinction
  # `continue-on-error` could not express, and why it is not used here.
  gadget:
    name: tier-1 gadget rig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: does this kernel support the rig?
        id: check
        run: |
          if ./ci/gadget-rig.sh check; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This runner's kernel cannot host the tier-1 rig; tier-0 still covers \
            all parsing and packet arithmetic. See the step log for which options are missing."
          fi
      - name: bring the gadget up
        if: steps.check.outputs.supported == 'true'
        run: sudo ./ci/gadget-rig.sh up
      - name: drive it
        if: steps.check.outputs.supported == 'true'
        run: |
          sudo -E env "PATH=$PATH" USB_ISO_GADGET=1 \
            cargo test -p uac-host --test gadget -- --ignored --test-threads=1
      - name: tear it down
        if: always() && steps.check.outputs.supported == 'true'
        run: sudo ./ci/gadget-rig.sh down || true
