name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors here as well as in scripts/check.sh; a lint that only fails in one place
  # trains people to ignore it in the other.
  RUSTFLAGS: -D warnings

jobs:
  # Tier 0: everything that needs no kernel. Runs on macOS too, because the point of splitting the
  # pure-logic modules out is that a contributor on any host can work on them.
  tier0:
    name: tier-0 tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo test --workspace --features uac-host/uac2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features uac-host/uac2 -- -D warnings

  # The transfer machinery is gated to Linux and Android, so a host-only job compiles almost none
  # of it. `cargo clippy` needs no NDK — it never links — so every target is checkable here.
  targets:
    name: clippy ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} --features uac-host/uac2 -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match `rust-version` in Cargo.toml. Bumping it is a breaking change for downstreams,
      # so it is verified rather than aspirational.
      - uses: dtolnay/rust-toolchain@1.77.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --features uac-host/uac2

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --features uac-host/uac2
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Tier 1: a real virtual USB Audio device via dummy_hcd + f_uac1.
  #
  # Continue-on-error on purpose, and NOT because the tests are flaky. GitHub's runner kernel is a
  # stock cloud image that has historically not shipped CONFIG_USB_DUMMY_HCD, so this job's real
  # output is the `check` step telling us whether the rig is possible there at all. Turn off
  # continue-on-error the day it passes; until then a red X here would just train people to ignore
  # the board.
  gadget:
    name: tier-1 gadget rig (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: does this kernel support the rig?
        run: ./ci/gadget-rig.sh check
      - name: bring the gadget up
        run: sudo ./ci/gadget-rig.sh up
      - name: drive it
        run: |
          sudo -E env "PATH=$PATH" USB_ISO_GADGET=1 \
            cargo test -p uac-host --test gadget -- --ignored --test-threads=1
      - name: tear it down
        if: always()
        run: sudo ./ci/gadget-rig.sh down || true
